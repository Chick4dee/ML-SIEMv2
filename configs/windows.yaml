# Эксперимент фичи 007: детектор на окнах потоков — бустинг против нейросети против текущей
# модели (`uv run mlsiem detect windows`). Контракт — specs/007-flow-window-detector/contracts/
# cli.md, решения — research.md (R1–R18). Все числа эксперимента живут здесь, а не в коде
# (FR-019): поменять длину окна или порог прироста можно без правки исходников, и каждое
# изменение попадает в хеш версии модели окон и в журнал MLflow.

# Основное разбиение 001: окна строятся отдельно в train / val / test и не пересекают границ
split: unsw_time
# Перенос для аудита (US2): победитель без переобучения на test этого разбиения. Оговорка
# 002: test unsw_cross_day — вторая половина дня 17-2, а train unsw_time содержит его начало
transfer_split: unsw_cross_day
# Один сид на всё: сдвиги, LightGBM, веса и батчи нейросети, перестановки аудита
seed: 42

window:
  # Длина окна по времени начала потока, мс (R1). Окна — на сетке от эпохи:
  # window_start = floor(first_seen / length) · length — одинаково в пакете и онлайн
  length_ms: 60000
  # Сколько первых по времени потоков окна видит нейросеть (R4). Замер 2026-09-26: медиана
  # окна ≈120 потоков, p99 ≈260 — 128 покрывает большинство окон целиком, а train с
  # аугментацией занимает ≈1.8 ГБ RAM. Сводные признаки бустинга считаются по ВСЕМ потокам
  seq_max: 128
  # Аугментация train сдвинутыми окнами (R9): та же длина, сетка сдвинута на 15/30/45 с.
  # 0 — основная сетка; val, test, хвост train и цепочка используют только её
  train_shifts_ms: [0, 15000, 30000, 45000]
  # Отложенный хвост train по времени — для ранней остановки обеих моделей (R5, R6), с
  # зазором в одно окно. Val в ранней остановке не участвует: он — для выбора и порога
  holdout_share: 0.10

# С кем сравнивать (R7): auto — модель прогона по правилам 004 (models/ensemble, если он
# обучен, иначе models/detector); можно указать каталог явно
current_model: auto
# Как свести оценки потоков текущей модели к окну (R7): max — «хоть один поток подозрителен».
# Среднее размыло бы «иголку» — одну атаку среди сотни нормальных потоков
current_aggregate: max

selection:
  # Метрика выбора (R8): macro PR-AUC по НАДЁЖНЫМ классам на val. Классы с единицами окон на
  # val дают PR-AUC 0 или 1 почти случайно и перекрыли бы реальную разницу моделей
  metric: macro_pr_auc_reliable_val
  # Надёжный класс — не меньше стольких окон на val (benign — по тому же правилу). Порог
  # записан ДО запуска, а не подобран по результату (замер: exploits 220, fuzzers 49,
  # reconnaissance 38, analysis 5 — надёжны benign, exploits, fuzzers, reconnaissance)
  min_class_windows: 20
  # Минимальный прирост (как в 002/004): шаг 1 — нейросеть против бустинга, шаг 2 —
  # победитель против текущей модели. Меньше прироста — побеждает более простое
  min_gain: 0.01

audit:
  # Вердикт аудита (R10): если метрика выбора на val без подозрительных признаков падает на
  # столько или больше, модель «опирается на артефакты» и не принимается (FR-012)
  max_drop: 0.10
  # Одиночный признак подозрителен, если сам по себе даёт не меньше этой доли качества модели
  single_feature_share: 0.90

candidates:
  # Бустинг на ~190 сводных признаках окна (R3, R6): параметры победителя 002; ранняя
  # остановка — по хвосту train, как у нейросети (одинаковый протокол — честное сравнение)
  lgbm:
    n_estimators: 400
    learning_rate: 0.05
    num_leaves: 63
    class_weight: balanced
    early_stopping_rounds: 30
  # Компактный двунаправленный GRU на последовательности потоков окна (R5): проекция 62 → 64,
  # biGRU 96, маскированные mean+max, склейка со скалярами окна, MLP → классы (~150 тыс.
  # параметров). Веса классов balanced с потолком 50; смешанная точность — только на CUDA
  gru:
    proj: 64
    hidden: 96
    dropout: 0.2
    lr: 0.001
    weight_decay: 0.0001
    batch: 256
    max_epochs: 40
    patience: 5
    class_weight_cap: 50
    amp: true

# Куда сохранить модель окон (R11): победитель сохраняется ВСЕГДА, даже при отрицательном
# результате (accepted: false) — чтобы вывод отчёта можно было проверить и воспроизвести
output: models/windows
