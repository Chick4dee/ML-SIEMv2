# Эксперимент «эксперты + мета-слой» (фича 004, `mlsiem detect ensemble`).
# Контракт — specs/004-detection-experts-ensemble/contracts/cli.md, решения — research R1–R7.
# Главное правило: test ни на что не влияет — ни на пороги, ни на выбор. Всё выбирается на val.

# Разбиение фичи 001. Эксперты учатся на train, мета-слой — на val (out-of-fold по блокам
# времени), test — только отчёт
split: unsw_time

# Сид для всех генераторов: подвыборка нормы, Isolation Forest, автокодировщик, стекинг,
# перестановочная важность. От него зависит воспроизводимость (SC-003)
seed: 42

# Эксперт-классификатор фичи 002 — берётся как есть и НЕ переобучается (FR-002)
classifier: models/detector

anomaly:
  # Кандидаты детектора аномалий (research R1). iforest — бейзлайн; autoencoder выигрывает,
  # только если лучше него на selection.min_gain по PR-AUC «атака/не атака» на val
  candidates:
    iforest: {n_estimators: 300, max_samples: 4096}
    autoencoder: {hidden: [32, 12, 32], max_iter: 200}
  # Сколько нормальных потоков train идёт на обучение. Полные 1.36 млн не нужны, чтобы
  # описать «норму», а автокодировщик на них учился бы десятки минут (R1)
  train_sample: 300000
  # Доля нормы train, отложенная ДО обучения на калибровку шкалы «перцентиль нормы» (R2).
  # Эти потоки эксперт не видит — иначе перцентиль был бы оптимистичным
  calibration_share: 0.10
  # Бюджет ложных срабатываний: порог эксперта — такой, что выше него не больше 0.5%
  # нормы val (FR-003, clarify Q4). Метки атак в выборе порога не участвуют
  anomaly_fpr: 0.005
  # Признаки, исключённые по итогам аудита артефактов (R6). Пусто — все признаки группы feature
  exclude_features: []

meta:
  # Кандидаты мета-слоя (R4): два правила без обучения и стекинг на логистической регрессии
  candidates: [any_fired, mean_score, stack_logreg]
  # На сколько последовательных по времени блоков делится val для out-of-fold (R3)
  folds: 5
  # Зазор у границ блоков (мс): потоки ближе этого к границе не учат соседний блок —
  # как зазор сплита 001, чтобы одна сессия не оказалась по обе стороны
  gap_ms: 60000

# Классы, которые прячутся от классификатора и мета-слоя в эксперименте «скрытый класс»
# (R5, FR-011): массовая (dos) и «штучная» (exploits) атаки с достаточным числом примеров
hidden_classes: [exploits, dos]

selection:
  # Ансамбль принимается, если на val лучше лучшего одиночного эксперта на min_gain macro PR-AUC
  min_gain: 0.01
  # …или ловит скрытые классы на min_unknown_gain лучше, а macro PR-AUC при этом падает
  # не больше чем на min_gain (FR-010, clarify Q1)
  min_unknown_gain: 0.10

# Аудит артефактов экспертов (research R6, FR-012)
audit:
  # Признак, который В ОДИНОЧКУ отделяет атаки от нормы на val с PR-AUC не ниже этого,
  # помечается «подозрение на артефакт генератора» (атака отличается инструментом, а не поведением)
  probe_flag: 0.9
  # Перестановочная важность считается на такой случайной подвыборке val: 58 пересчётов
  # скора на всех 250 тыс. потоков заняли бы слишком долго, а ранжирование от этого не меняется
  permutation_rows: 50000
  # Сколько самых важных признаков писать в отчёт
  top: 10

# Класс с меньшим числом примеров в оцениваемой части — PR-AUC по нему помечается «ненадёжен»
unreliable_below: 50

# Куда сохранить артефакты (выходы DVC-стадии train_ensemble)
output: {anomaly: models/experts/anomaly, ensemble: models/ensemble}
