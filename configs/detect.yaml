# Эксперимент детектора (фича 002, `mlsiem detect train`).
# Контракт — specs/002-detection-incident-chain/contracts/cli.md, решения — research R1–R7.

# Разбиение фичи 001, на котором обучаются и сравниваются кандидаты:
# train — обучение, val — подбор порога и выбор победителя, test — только итоговая оценка
split: unsw_time

# Разбиение для проверки переноса на другой день: победитель (обученный на train `split`,
# без переобучения) оценивается на его test-части
transfer_split: unsw_cross_day

# Сид для всех генераторов случайных чисел — от него зависит воспроизводимость (SC-002)
seed: 42

selection:
  # По какой метрике выбирается победитель: macro PR-AUC на val (test в выборе не участвует)
  metric: macro_pr_auc_val
  # Минимальный прирост над бейзлайном (logreg). Если сложная модель лучше меньше чем на это
  # значение — выбираем бейзлайн: при равном качестве простое лучше (принцип IV конституции)
  min_gain: 0.01

# Кандидаты: имя → гиперпараметры. Первый — бейзлайн. Веса классов balanced у обоих:
# в train классы от 118 до 1.36 млн примеров, без весов редкие классы модель игнорирует
candidates:
  logreg: {C: 1.0, max_iter: 1000, class_weight: balanced}
  lgbm: {n_estimators: 400, learning_rate: 0.05, num_leaves: 63, class_weight: balanced}

# Куда сохранить артефакт победителя (выход DVC-стадии train_detector)
output: models/detector
