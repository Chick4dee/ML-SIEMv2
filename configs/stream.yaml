# Потоковая обработка через Kafka (фича 005, `mlsiem stand …` и `mlsiem stream …`).
# Контракт — specs/005-kafka-streaming-chain/contracts/cli.md, решения — research.md (R1–R15).
# Все числа потока живут здесь, в коде их нет (FR-023).

broker:
  # Адрес брокера в служебной сети mlsiem-mgmt (R2): брокерная машина stand.broker_ip, порт 9092
  bootstrap: 10.77.0.10:9092
  # Сколько секунд ждать брокер при подключении, прежде чем сказать «недоступен» (FR-004,
  # SC-001 требует ответа проверки ≤ 10 с) — вместо бесконечного зависания клиента
  connect_timeout_s: 10

topics:
  # Потоки (сообщения flow и end) и отвергнутые сообщения с причиной (R5, data-model)
  flows: mlsiem.flows
  rejected: mlsiem.flows.rejected
  # Одна партиция — один потребитель читает строго в порядке отправки, это упрощает
  # эквивалентность с пакетным режимом (R5). Больше — только вместе с несколькими источниками
  partitions: 1
  # Срок хранения сообщений на диске брокера, часов (7 дней): хватает перечитать неделю назад
  retention_hours: 168

consumer:
  # Группа потребителей Kafka. Позиция-истина хранится в SQLite (R7), группа нужна клиенту
  group: mlsiem-chain
  # Пачка: до 5000 сообщений или 500 мс ожидания — что раньше (R7). В реальном времени
  # пачки маленькие (сообщений мало), и задержку поток → алерт (SC-003) ограничивает ожидание
  # 500 мс, а не размер. Размер важен под нагрузкой (--speed max): у предсказания модели и
  # транзакции SQLite есть цена на каждый вызов. Замер на стенде 2026-09-26: 2000 → хвост
  # потребителя после конца проигрывания 31 с (цель SC-002 — ≤ 30 с), 5000 → 26.8 с
  batch_max_messages: 5000
  batch_max_wait_ms: 500
  # Допустимое опоздание потока по времени трафика (2 минуты, спека Assumptions, R8): поток,
  # начавшийся раньше максимума сеанса больше чем на это, помечается late
  allowed_lateness_ms: 120000
  # Аренда единственного потребителя (FR-019, R7): продлевается каждые lease_ttl_s/6 с,
  # истекает через lease_ttl_s без продления — тогда другой потребитель может её забрать
  lease_ttl_s: 30
  # Как часто писать показатели в stream_stats (R11), секунд
  stats_interval_s: 1
  # Сколько секунд повторять запись пачки, если SQLite занята или недоступна, прежде чем
  # остановиться без подтверждения сообщений (US4 п. 3, T045): паузы 0.5, 1, 2, 4… с
  db_retry_s: 60
  # Строка показателей в stderr во время работы `stream consume` — раз в столько секунд
  report_interval_s: 10

replay:
  # Темп проигрывания по умолчанию: «реальное время × 60» (1 час трафика ≈ 1 минута);
  # `--speed max` — без пауз
  default_speed: 60
  # Прогресс проигрывателя в stderr — раз в столько секунд
  progress_interval_s: 1

stand:
  # Брокерная машина Hyper-V и сети стенда (R1–R3). Скрипты stand/hyperv/*.ps1 берут
  # значения только отсюда (через stand/hyperv/Read-StreamConfig.ps1)
  vm_name: mlsiem-broker
  # Служебная сеть (Internal): хост и брокер, позже сенсор 006
  mgmt_switch: mlsiem-mgmt
  # Сеть стенда (Private): в 005 пустая заготовка для 006; брокера в ней нет (FR-003a)
  lab_switch: mlsiem-lab
  host_ip: 10.77.0.1
  broker_ip: 10.77.0.10
  prefix: 24
  # Ресурсы машины (R1, SC-007): 2 ГБ статически, 2 vCPU, диск 20 ГБ динамический
  memory_mb: 2048
  cpus: 2
  disk_gb: 20
  # Куча JVM брокера (-Xms/-Xmx): 512 МБ оставляют ОС машины запас из её 2 ГБ
  kafka_heap_mb: 512
  # Версия Kafka и SHA-512 архива kafka_2.13-<версия>.tgz с downloads.apache.org (R1).
  # Как обновить: открыть https://downloads.apache.org/kafka/<версия>/kafka_2.13-<версия>.tgz.sha512,
  # переписать сумму строчными буквами без пробелов, пересобрать seed-ISO (`mlsiem stand seed-iso`)
  kafka_version: 4.3.1
  kafka_sha512: c7d7b2318cb51aa0c61d3246a51c349210073c5c9b754947ef965a439f2f939e8600f204e134a75ac31faf3829c9370960ef7c6a9886c8a1dbf0339a21f4c54c
  # Идентификатор кластера KRaft (`kafka-storage.sh format --cluster-id`): фиксирован, чтобы
  # пересоздание машины давало тот же результат (22 символа base64url, формат Kafka)
  cluster_id: bWxzaWVtLWJyb2tlci0wMQ
  # Пользователь брокерной машины (SSH-вход по ключу хоста, пароля нет)
  admin_user: mlsiem
  # Постоянные MAC-адреса адаптеров машины (префикс Hyper-V 00:15:5D): по ним автоустановка
  # отличает служебный адаптер (статический адрес) от установочного (DHCP через Default
  # Switch), а скрипт 20-vm-broker.ps1 ставит их адаптерам — без этого порядок eth0/eth1
  # не гарантирован. В кавычках: иначе YAML прочитал бы «чисто цифровой» MAC как число
  mgmt_mac: "00:15:5D:4D:00:10"
  install_mac: "00:15:5D:4D:00:11"

# ----------------------------------------------------------------------------------------
# Фича 006: лабораторный стенд и живой сенсор (`mlsiem stand …`, `mlsiem stream sensor …`,
# `mlsiem lab …`). Контракт — specs/006-lab-stand-live-sensor/contracts/cli.md, решения —
# research.md (R1–R18). Как и всё в этом файле, числа стенда живут только здесь.
# ----------------------------------------------------------------------------------------

lab:
  # Подсеть сети стенда mlsiem-lab (Private, R2). Все цели сценариев обязаны лежать в ней
  # (FR-013): так атака физически не может уйти за пределы стенда
  subnet: 10.88.0.0/24
  # Жертва: службы без данных владельца (R4). Адрес статический, по MAC (пересоздание ВМ
  # не меняет адрес). ssh_user/ssh_password — тестовая учётка ТОЛЬКО для сценария перебора и
  # нормы; пароль заведомо слабый и нужен лишь внутри изолированной сети стенда
  victim:
    vm: mlsiem-victim
    ip: 10.88.0.20
    services: [web, ssh, ftp, dns]
    ssh_user: labuser
    ssh_password: labpass123
    memory_mb: 1024
    cpus: 1
    disk_gb: 10
  # Атакующий: nmap, ffuf, hydra, slowhttptest, tcpreplay (R5). mgmt — канал управления с
  # хоста (R6) без сети: com — именованный канал COM-порта ВМ (работает с Linux-гостем; по
  # умолчанию), powershell-direct — Invoke-Command -VMName (только Windows-гости, оставлен
  # по плану R6 на случай другого образа)
  attacker:
    vm: mlsiem-attacker
    ip: 10.88.0.30
    mgmt: com
    memory_mb: 1024
    cpus: 1
    disk_gb: 10
  # Сенсор (R7): процесс на брокерной машине (placement: broker) со вторым адаптером в
  # mlsiem-lab без IP; vm — запасной вариант R7a (отдельная ВМ-сенсор). iface — интерфейс-
  # приёмник зеркала в госте. buffer_flows — сколько завершённых потоков копить при
  # недоступном брокере (R10): ~5 минут нормы стенда. pcap_limit_gb — предел записи сеанса
  # (R12), на нём запись ротируется. report_interval_s — как часто писать показатели
  sensor:
    placement: broker
    vm: mlsiem-sensor
    iface: eth1
    source_id: sensor:live
    buffer_flows: 3000
    pcap_limit_gb: 5
    report_interval_s: 5
    # Живость: сенсор «жив», если последний пакет был не раньше стольки секунд назад
    liveness_s: 30
    # Дополнительная память брокерной машине под сенсор (R7), МБ
    extra_memory_mb: 1024
  # Допустимое расхождение часов атакующего и сенсора, секунд (R13): больше — разметка набора
  # по журналу сценариев ненадёжна, `stand check` сообщает проблему
  clock_skew_max_s: 1
  # Свободная память хоста, ниже которой `stand check` предупреждает (SC-009), ГБ
  host_free_gb_min: 4
  # Постоянные MAC адаптеров стенда (префикс Hyper-V 00:15:5D), как в разделе stand: по ним
  # автоустановка отличает адаптеры; в кавычках, чтобы YAML не прочитал их как число
  lab_mac:
    victim: "00:15:5D:4D:00:20"
    victim_install: "00:15:5D:4D:00:21"
    attacker: "00:15:5D:4D:00:30"
    attacker_install: "00:15:5D:4D:00:31"
    sensor: "00:15:5D:4D:00:40"

# Фоновая норма (R14, FR-019): обычный трафик к службам жертвы. Раннер на атакующей машине
# каждые period_s секунд делает по одному «шагу» из mix — вес шага задаёт долю
normal:
  period_s: 5
  mix:
    web: 5
    ssh: 1
    ftp: 1
    dns: 3
  # Сколько секунд ждать ответ службы, прежде чем считать шаг неудачным
  step_timeout_s: 10

# Сценарии атак (R11, FR-012/013). version входит в журнал и манифест набора: другой сценарий
# → другая версия. {target} подставляется адресом жертвы из lab.victim.ip, {port} — портом
# службы; цель вне lab.subnet раннер отклоняет до запуска. expected_class — класс таксономии
# UNSW или out_of_taxonomy (подбор паролей в UNSW 2015 нет); catch_threshold — доля потоков с
# алертом, ниже которой отчёт оценки разбирает сценарий как «слабо пойманный» (R16)
scenarios:
  - name: control_replay
    version: "1"
    tool: tcpreplay
    # Контрольный сценарий (R9): узнаваемый фрагмент UNSW с подменой адресов на адреса стенда.
    # pcap — артефакт на атакующей машине; *_map — «адрес во фрагменте:адрес стенда» для
    # tcprewrite --pnat (подменяются обе стороны потока, суммы пересчитываются). Адреса
    # фрагмента — атакующий и жертва UNSW; новые обязаны лежать в lab.subnet (FR-013).
    # tcpreplay идёт с исходными таймингами записи: так признаки потоков остаются узнаваемыми
    pcap: /opt/mlsiem/control_replay.pcap
    src_map: "175.45.176.1:10.88.0.30"
    dst_map: "149.171.126.10:10.88.0.20"
    args: "--intf1=lab0 {pcap}"
    target: web
    expected_class: generic
    rate_limit: topspeed
    duration_limit_s: 120
    catch_threshold: 0.5
  - name: port_scan
    version: "1"
    tool: nmap
    args: "-sS -p 1-1024 -T4 {target}"
    target: web
    expected_class: reconnaissance
    rate_limit: "T4"
    duration_limit_s: 120
    catch_threshold: 0.3
  - name: web_fuzz
    version: "1"
    tool: ffuf
    args: "-u http://{target}:{port}/FUZZ -w /usr/share/wordlists/common.txt -rate 200"
    target: web
    expected_class: fuzzers
    rate_limit: "200 запросов/с"
    duration_limit_s: 120
    catch_threshold: 0.3
  - name: ssh_bruteforce
    version: "1"
    tool: hydra
    args: "-l {ssh_user} -P /usr/share/wordlists/pass.txt -t 4 ssh://{target}"
    target: ssh
    expected_class: out_of_taxonomy
    rate_limit: "4 потока"
    duration_limit_s: 120
    catch_threshold: 0.3
  - name: web_dos
    version: "1"
    tool: slowhttptest
    args: "-c 400 -H -i 10 -r 100 -t GET -u http://{target}:{port}/ -l 60"
    target: web
    expected_class: dos
    rate_limit: "100 соединений/с"
    duration_limit_s: 90
    catch_threshold: 0.3
