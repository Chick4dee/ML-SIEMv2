# Потоковая обработка через Kafka (фича 005, `mlsiem stand …` и `mlsiem stream …`).
# Контракт — specs/005-kafka-streaming-chain/contracts/cli.md, решения — research.md (R1–R15).
# Все числа потока живут здесь, в коде их нет (FR-023).

broker:
  # Адрес брокера в служебной сети mlsiem-mgmt (R2): брокерная машина stand.broker_ip, порт 9092
  bootstrap: 10.77.0.10:9092
  # Сколько секунд ждать брокер при подключении, прежде чем сказать «недоступен» (FR-004,
  # SC-001 требует ответа проверки ≤ 10 с) — вместо бесконечного зависания клиента
  connect_timeout_s: 10

topics:
  # Потоки (сообщения flow и end) и отвергнутые сообщения с причиной (R5, data-model)
  flows: mlsiem.flows
  rejected: mlsiem.flows.rejected
  # Одна партиция — один потребитель читает строго в порядке отправки, это упрощает
  # эквивалентность с пакетным режимом (R5). Больше — только вместе с несколькими источниками
  partitions: 1
  # Срок хранения сообщений на диске брокера, часов (7 дней): хватает перечитать неделю назад
  retention_hours: 168

consumer:
  # Группа потребителей Kafka. Позиция-истина хранится в SQLite (R7), группа нужна клиенту
  group: mlsiem-chain
  # Пачка: до 5000 сообщений или 500 мс ожидания — что раньше (R7). В реальном времени
  # пачки маленькие (сообщений мало), и задержку поток → алерт (SC-003) ограничивает ожидание
  # 500 мс, а не размер. Размер важен под нагрузкой (--speed max): у предсказания модели и
  # транзакции SQLite есть цена на каждый вызов. Замер на стенде 2026-09-26: 2000 → хвост
  # потребителя после конца проигрывания 31 с (цель SC-002 — ≤ 30 с), 5000 → 26.8 с
  batch_max_messages: 5000
  batch_max_wait_ms: 500
  # Допустимое опоздание потока по времени трафика (2 минуты, спека Assumptions, R8): поток,
  # начавшийся раньше максимума сеанса больше чем на это, помечается late
  allowed_lateness_ms: 120000
  # Аренда единственного потребителя (FR-019, R7): продлевается каждые lease_ttl_s/6 с,
  # истекает через lease_ttl_s без продления — тогда другой потребитель может её забрать
  lease_ttl_s: 30
  # Как часто писать показатели в stream_stats (R11), секунд
  stats_interval_s: 1
  # Сколько секунд повторять запись пачки, если SQLite занята или недоступна, прежде чем
  # остановиться без подтверждения сообщений (US4 п. 3, T045): паузы 0.5, 1, 2, 4… с
  db_retry_s: 60
  # Строка показателей в stderr во время работы `stream consume` — раз в столько секунд
  report_interval_s: 10

replay:
  # Темп проигрывания по умолчанию: «реальное время × 60» (1 час трафика ≈ 1 минута);
  # `--speed max` — без пауз
  default_speed: 60
  # Прогресс проигрывателя в stderr — раз в столько секунд
  progress_interval_s: 1

stand:
  # Брокерная машина Hyper-V и сети стенда (R1–R3). Скрипты stand/hyperv/*.ps1 берут
  # значения только отсюда (через stand/hyperv/Read-StreamConfig.ps1)
  vm_name: mlsiem-broker
  # Служебная сеть (Internal): хост и брокер, позже сенсор 006
  mgmt_switch: mlsiem-mgmt
  # Сеть стенда (Private): в 005 пустая заготовка для 006; брокера в ней нет (FR-003a)
  lab_switch: mlsiem-lab
  host_ip: 10.77.0.1
  broker_ip: 10.77.0.10
  prefix: 24
  # Ресурсы машины (R1, SC-007): 2 ГБ статически, 2 vCPU, диск 20 ГБ динамический
  memory_mb: 2048
  cpus: 2
  disk_gb: 20
  # Куча JVM брокера (-Xms/-Xmx): 512 МБ оставляют ОС машины запас из её 2 ГБ
  kafka_heap_mb: 512
  # Версия Kafka и SHA-512 архива kafka_2.13-<версия>.tgz с downloads.apache.org (R1).
  # Как обновить: открыть https://downloads.apache.org/kafka/<версия>/kafka_2.13-<версия>.tgz.sha512,
  # переписать сумму строчными буквами без пробелов, пересобрать seed-ISO (`mlsiem stand seed-iso`)
  kafka_version: 4.3.1
  kafka_sha512: c7d7b2318cb51aa0c61d3246a51c349210073c5c9b754947ef965a439f2f939e8600f204e134a75ac31faf3829c9370960ef7c6a9886c8a1dbf0339a21f4c54c
  # Идентификатор кластера KRaft (`kafka-storage.sh format --cluster-id`): фиксирован, чтобы
  # пересоздание машины давало тот же результат (22 символа base64url, формат Kafka)
  cluster_id: bWxzaWVtLWJyb2tlci0wMQ
  # Пользователь брокерной машины (SSH-вход по ключу хоста, пароля нет)
  admin_user: mlsiem
  # Постоянные MAC-адреса адаптеров машины (префикс Hyper-V 00:15:5D): по ним автоустановка
  # отличает служебный адаптер (статический адрес) от установочного (DHCP через Default
  # Switch), а скрипт 20-vm-broker.ps1 ставит их адаптерам — без этого порядок eth0/eth1
  # не гарантирован. В кавычках: иначе YAML прочитал бы «чисто цифровой» MAC как число
  mgmt_mac: "00:15:5D:4D:00:10"
  install_mac: "00:15:5D:4D:00:11"

# ----------------------------------------------------------------------------------------
# Фича 006: лабораторный стенд и живой сенсор (`mlsiem stand …`, `mlsiem stream sensor …`,
# `mlsiem lab …`). Контракт — specs/006-lab-stand-live-sensor/contracts/cli.md, решения —
# research.md (R1–R18). Как и всё в этом файле, числа стенда живут только здесь.
# ----------------------------------------------------------------------------------------

lab:
  # Подсеть сети стенда mlsiem-lab (Private, R2). Все цели сценариев обязаны лежать в ней
  # (FR-013): так атака физически не может уйти за пределы стенда
  subnet: 10.88.0.0/24
  # Жертва: службы без данных владельца (R4). Адрес статический, по MAC (пересоздание ВМ
  # не меняет адрес). ssh_user/ssh_password — тестовая учётка ТОЛЬКО для сценария перебора и
  # нормы; пароль заведомо слабый и нужен лишь внутри изолированной сети стенда
  victim:
    vm: mlsiem-victim
    ip: 10.88.0.20
    services: [web, ssh, ftp, dns]
    ssh_user: labuser
    ssh_password: labpass123
    memory_mb: 1024
    cpus: 1
    disk_gb: 10
  # Атакующий: nmap, ffuf, hydra, slowhttptest, tcpreplay (R5). mgmt — канал управления с
  # хоста (R6) без сети: com — именованный канал COM-порта ВМ (работает с Linux-гостем; по
  # умолчанию), powershell-direct — Invoke-Command -VMName (только Windows-гости, оставлен
  # по плану R6 на случай другого образа)
  attacker:
    vm: mlsiem-attacker
    ip: 10.88.0.30
    mgmt: com
    memory_mb: 1024
    cpus: 1
    disk_gb: 10
  # Источники трафика (008, R2): атакующий и его алиасы на интерфейсе lab0; норма идёт с тех же
  # адресов, поэтому адрес источника не определяет класс. Клиент нормы и вторая атакующая ВМ
  # добавляются сюда же (role: client | attacker)
  sources:
    - {name: attacker,    ip: 10.88.0.30, role: attacker, os: ubuntu-24.04}
    - {name: attacker_a2, ip: 10.88.0.32, role: attacker, os: ubuntu-24.04, alias_of: attacker}
    - {name: attacker_a3, ip: 10.88.0.33, role: attacker, os: ubuntu-24.04, alias_of: attacker}
  # Сенсор (R7): процесс на брокерной машине (placement: broker) со вторым адаптером в
  # mlsiem-lab без IP; vm — запасной вариант R7a (отдельная ВМ-сенсор). iface — интерфейс-
  # приёмник зеркала в госте. buffer_flows — сколько завершённых потоков копить при
  # недоступном брокере (R10): ~5 минут нормы стенда. pcap_limit_gb — предел записи сеанса
  # (R12), на нём запись ротируется. report_interval_s — как часто писать показатели
  sensor:
    placement: broker
    vm: mlsiem-sensor
    iface: eth1
    source_id: sensor:live
    buffer_flows: 3000
    pcap_limit_gb: 5
    report_interval_s: 5
    # Живость: сенсор «жив», если последний пакет был не раньше стольки секунд назад
    liveness_s: 30
    # Дополнительная память брокерной машине под сенсор (R7), МБ
    extra_memory_mb: 1024
  # Допустимое расхождение часов атакующего и сенсора, секунд (R13): больше — разметка набора
  # по журналу сценариев ненадёжна, `stand check` сообщает проблему
  clock_skew_max_s: 1
  # Свободная память хоста, ниже которой `stand check` предупреждает (SC-009), ГБ
  host_free_gb_min: 4
  # Постоянные MAC адаптеров стенда (префикс Hyper-V 00:15:5D), как в разделе stand: по ним
  # автоустановка отличает адаптеры; в кавычках, чтобы YAML не прочитал их как число
  lab_mac:
    victim: "00:15:5D:4D:00:20"
    victim_install: "00:15:5D:4D:00:21"
    attacker: "00:15:5D:4D:00:30"
    attacker_install: "00:15:5D:4D:00:31"
    sensor: "00:15:5D:4D:00:40"

# Фоновая норма (R14, FR-019): обычный трафик к службам жертвы. Раннер на атакующей машине
# каждые period_s секунд делает по одному «шагу» из mix — вес шага задаёт долю
normal:
  # 008: норма идёт с нескольких адресов стенда и в несколько рабочих потоков — набору нужны
  # тысячи нормальных потоков в тесте (SC-002); period_s — пауза рабочего между шагами
  period_s: 0.4
  workers: 2
  sources: [attacker, attacker_a2, attacker_a3]
  mix:
    web: 5
    ssh: 1
    ftp: 1
    dns: 3
  # Сколько секунд ждать ответ службы, прежде чем считать шаг неудачным
  step_timeout_s: 10

# Сценарии атак (R11, FR-012/013). version входит в журнал и манифест набора: другой сценарий
# → другая версия. {target} подставляется адресом жертвы из lab.victim.ip, {port} — портом
# службы; цель вне lab.subnet раннер отклоняет до запуска. expected_class — класс таксономии
# UNSW или out_of_taxonomy (подбор паролей в UNSW 2015 нет); catch_threshold — доля потоков с
# алертом, ниже которой отчёт оценки разбирает сценарий как «слабо пойманный» (R16)
scenarios:
  - name: control_replay
    version: "1"
    tool: tcpreplay
    # Контрольный сценарий (R9): узнаваемый фрагмент UNSW с подменой адресов на адреса стенда.
    # pcap — артефакт на атакующей машине; *_map — «адрес во фрагменте:адрес стенда» для
    # tcprewrite --pnat (подменяются обе стороны потока, суммы пересчитываются). Адреса
    # фрагмента — атакующий и жертва UNSW; новые обязаны лежать в lab.subnet (FR-013).
    # tcpreplay идёт с исходными таймингами записи: так признаки потоков остаются узнаваемыми
    pcap: /opt/mlsiem/control_replay.pcap
    src_map: "175.45.176.1:10.88.0.30"
    dst_map: "149.171.126.10:10.88.0.20"
    args: "--intf1=lab0 {pcap}"
    target: web
    expected_class: generic
    rate_limit: topspeed
    duration_limit_s: 120
    catch_threshold: 0.5
  - name: port_scan
    version: "1"
    tool: nmap
    args: "-sS -p 1-1024 -T4 {target}"
    target: web
    expected_class: reconnaissance
    rate_limit: "T4"
    duration_limit_s: 120
    catch_threshold: 0.3
  - name: web_fuzz
    version: "1"
    tool: ffuf
    args: "-u http://{target}:{port}/FUZZ -w /usr/share/wordlists/common.txt -rate 200"
    target: web
    expected_class: fuzzers
    rate_limit: "200 запросов/с"
    duration_limit_s: 120
    catch_threshold: 0.3
  - name: ssh_bruteforce
    version: "1"
    tool: hydra
    args: "-l {ssh_user} -P /usr/share/wordlists/pass.txt -t 4 ssh://{target}"
    target: ssh
    expected_class: out_of_taxonomy
    rate_limit: "4 потока"
    duration_limit_s: 120
    catch_threshold: 0.3
  - name: web_dos
    version: "1"
    tool: slowhttptest
    args: "-c 400 -H -i 10 -r 100 -t GET -u http://{target}:{port}/ -l 60"
    target: web
    expected_class: dos
    rate_limit: "100 соединений/с"
    duration_limit_s: 90
    catch_threshold: 0.3

  # --- Фича 008: сценарии версии 2 с вариантами (инструмент, параметры, источник) -------------
  # Вариант = поля сценария + свои. source_bind: `flag <аргументы>` — флаги инструмента ({src},
  # {iface}); `route` — маршрут с нужным src на время запуска. params: values — допустимые значения
  # (первое — по умолчанию), holdout — значения только для тестовых повторов (FR-005).
  # reserve_unknown — класс или вариант присутствует только в тесте (FR-021). tool_label — имя
  # инструмента в журнале, если tool — оболочка. {port} — порт службы target.
  - name: scan
    version: "2"
    target: web
    expected_class: reconnaissance
    rate_limit: "см. варианты"
    duration_limit_s: 120
    catch_threshold: 0.3
    variants:
      - name: nmap_syn
        tool: nmap
        args: "-sS -Pn -p {ports} -T{timing} {target}"
        source_bind: "flag -S {src} -e {iface}"
        params:
          ports: {values: ["1-1024", "1-65535", "22,80,443,8080"], holdout: ["1-65535"]}
          timing: {values: [3, 4, 2], holdout: [2]}
      - name: nmap_connect
        tool: nmap
        args: "-sT -Pn -p {ports} -T{timing} {target}"
        source_bind: route
        params:
          ports: {values: ["1-1024", "1-65535", "22,80,443,8080"], holdout: ["1-65535"]}
          timing: {values: [3, 4, 2], holdout: [2]}
      - name: masscan
        tool: masscan
        args: "-p{ports} --rate {rate} --interface {iface} --source-ip {src} --router-ip {target} {target}"
        reserve_unknown: true
        params:
          ports: {values: ["1-1024", "1-9000"], holdout: ["1-9000"]}
          rate: {values: [500, 2000], holdout: [2000]}
  - name: fuzz
    version: "2"
    target: web
    expected_class: fuzzers
    rate_limit: "см. варианты"
    duration_limit_s: 120
    catch_threshold: 0.3
    variants:
      - name: ffuf
        tool: ffuf
        args: "-u http://{target}:{port}/FUZZ -w /usr/share/wordlists/common.txt -rate {rate} -t {threads} -s"
        source_bind: route
        params:
          rate: {values: [100, 200, 400], holdout: [400]}
          threads: {values: [10, 40], holdout: [40]}
      - name: gobuster
        tool: gobuster
        args: "dir -u http://{target}:{port}/ -w /usr/share/wordlists/common.txt -t {threads} -q --no-error"
        source_bind: route
        reserve_unknown: true
        params:
          threads: {values: [10, 30], holdout: [30]}
  - name: ssh_brute
    version: "2"
    target: ssh
    expected_class: out_of_taxonomy
    rate_limit: "см. варианты"
    duration_limit_s: 120
    catch_threshold: 0.3
    variants:
      - name: hydra
        tool: hydra
        args: "-l {ssh_user} -P /usr/share/wordlists/pass.txt -t {threads} ssh://{target}"
        source_bind: route
        params:
          threads: {values: [4, 2, 8], holdout: [8]}
      - name: medusa
        tool: medusa
        args: "-h {target} -u {ssh_user} -P /usr/share/wordlists/pass.txt -M ssh -t {threads}"
        source_bind: route
        params:
          threads: {values: [4, 2, 8], holdout: [8]}
  - name: slow_dos
    version: "2"
    target: web
    expected_class: dos
    rate_limit: "см. варианты"
    duration_limit_s: 90
    catch_threshold: 0.3
    variants:
      - name: slowhttptest
        tool: slowhttptest
        args: "-c {conns} -H -i 10 -r 100 -t GET -u http://{target}:{port}/ -l 60"
        source_bind: route
        params:
          conns: {values: [200, 400, 300], holdout: [300]}
      - name: slowloris
        tool: slowloris
        args: "{target} -p {port} -s {sockets} --sleeptime 10 -v"
        source_bind: route
        params:
          sockets: {values: [150, 300, 100], holdout: [100]}
  - name: flood
    version: "2"
    target: web
    expected_class: dos
    rate_limit: "см. варианты"
    duration_limit_s: 60
    catch_threshold: 0.3
    variants:
      - name: hping_syn
        tool: hping3
        args: "-S -p {port} -i u{interval} -q {target}"
        # hping3 (сырые сокеты) не берёт src-подсказку маршрута, а для адреса-алиаса сваливается
        # в 127.0.0.1 — пакеты тогда не привязываются к окну атаки и утекают в benign; поэтому
        # источник задаём флагом самого hping (-a), это детерминированно и помечается верно.
        source_bind: "flag -a {src}"
        params:
          interval: {values: [2000, 1000, 500], holdout: [500]}
      - name: hping_udp
        tool: hping3
        target: dns
        args: "--udp -p {port} -d {size} -i u{interval} -q {target}"
        source_bind: "flag -a {src}"
        params:
          size: {values: [64, 512], holdout: [512]}
          interval: {values: [2000, 1000], holdout: [1000]}
  - name: exploit
    version: "2"
    target: web
    expected_class: exploits
    rate_limit: "см. варианты"
    duration_limit_s: 120
    catch_threshold: 0.3
    variants:
      - name: sqlmap
        tool: sqlmap
        args: "-u http://{target}:8080/search?q=1 --batch --level {level} --risk 1 --technique B --threads {threads} --flush-session -v 0"
        source_bind: route
        params:
          level: {values: [1, 2, 3], holdout: [3]}
          threads: {values: [1, 4], holdout: [4]}
      - name: nikto
        tool: nikto
        version_arg: "-Version"
        args: "-h http://{target}:{port} -Tuning {tuning} -maxtime {maxtime}s -nointeractive"
        source_bind: route
        params:
          tuning: {values: ["1", "4", "9"], holdout: ["9"]}
          maxtime: {values: [60, 100], holdout: [100]}
  - name: beacon
    version: "2"
    target: web
    expected_class: out_of_taxonomy
    reserve_unknown: true
    rate_limit: "один запрос раз в 3–12 с"
    duration_limit_s: 130
    catch_threshold: 0.3
    variants:
      - name: curl_loop
        tool: bash
        tool_label: curl_loop
        args: "-c 'end=$((SECONDS+{dur})); while [ $SECONDS -lt $end ]; do curl -s -m 3 -o /dev/null --interface {src} http://{target}:{port}/api/status; sleep $(( {period} + RANDOM % {jitter} )); done'"
        params:
          dur: {values: [100]}
          period: {values: [3, 5, 8], holdout: [8]}
          jitter: {values: [2, 4]}
      - name: wget_loop
        tool: bash
        tool_label: wget_loop
        args: "-c 'end=$((SECONDS+{dur})); while [ $SECONDS -lt $end ]; do wget -q -O /dev/null -T 3 --bind-address={src} http://{target}:{port}/api/status; sleep $(( {period} + RANDOM % {jitter} )); done'"
        params:
          dur: {values: [100]}
          period: {values: [3, 5, 8], holdout: [8]}
          jitter: {values: [2, 4]}
  # Сложная норма (FR-004): внешне похожа на атаку, метка benign
  - name: hard_normal
    version: "2"
    target: web
    hard: true
    expected_class: benign
    rate_limit: "см. варианты"
    duration_limit_s: 100
    catch_threshold: 0.3
    variants:
      - name: ab_loadtest
        tool: ab
        version_arg: "-V"
        args: "-B {src} -n {requests} -c {conc} -q http://{target}:{port}/"
        params:
          requests: {values: [1500, 3000], holdout: [3000]}
          conc: {values: [10, 30], holdout: [30]}
      - name: nmap_monitor
        tool: bash
        tool_label: nmap_monitor
        args: "-c 'for i in $(seq 1 {n}); do nmap -sT -Pn -p 22,80,443 --max-retries 1 {target} >/dev/null; sleep {gap}; done'"
        source_bind: route
        params:
          n: {values: [20, 30], holdout: [30]}
          gap: {values: [2, 4]}

# --- Фича 008: сбор набора (R6, R8, R15) ---------------------------------------------------------
# План строится по сиду из сценариев версий `versions`; раунд r — повтор r всех вариантов в случайном
# порядке, поэтому порядок по времени совпадает с порядком повторов (разбиение по времени = по
# повторам). Паузы ≥ idle-таймаут экстрактора + 30 с: потоки предыдущего запуска закрываются.
collection:
  seed: 7
  repeats: 10
  versions: ["2"]
  pause_s: 150
  # Доля запусков, в которых норма идёт и во время атаки (в паузах она идёт всегда)
  normal_share: 0.67
  # Сколько раз за раунд выполняется резервный («неизвестный») вариант — только в тестовых раундах
  reserve_runs_per_round: 3
  parts: {train: [1, 2, 3, 4, 5, 6], val: [7, 8], test: [9, 10]}
  # Запись сеанса на сенсорной машине (tcpdump на приёмнике зеркала), забирается на хост
  capture:
    ssh: mlsiem@10.77.0.50
    iface: labmir
    remote_dir: /var/lib/mlsiem/lab
    rotate_mb: 4000
    ssh_options: ["-o", "BatchMode=yes", "-o", "ConnectTimeout=8", "-o", "UserKnownHostsFile=/dev/null", "-o", "StrictHostKeyChecking=no"]
  # Запас по времени ответа раннера сверх предела запуска, с
  reply_margin_s: 40

# --- Фича 008: аудит ярлыков (R9–R11) ---------------------------------------------------------
shortcuts:
  min_test_flows: 100
  seeds: [0, 1, 2]
  fpr_levels: [0.001, 0.01, 0.05]
  audit_drop_threshold: 0.05
  env_features: [bidirectional_ece_packets, bidirectional_cwr_packets, bidirectional_urg_packets,
                 bidirectional_min_ps, bidirectional_max_ps]
