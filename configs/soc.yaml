# SOC-часть цепочки (фича 002, `mlsiem soc run|serve|status`).
# Контракт — specs/002-detection-incident-chain/contracts/cli.md, решения — research R8–R12.

# SQLite-база инцидентов, алертов, действий и аудит-журнала (рабочее состояние аналитика)
db: var/soc.db
# Каталог прогонов: var/runs/<run_id>/verdicts.parquet (и flows.parquet для PCAP)
runs_dir: var/runs

# API аналитика. Слушаем только локальный адрес — аутентификации в этой фиче нет
api: {host: 127.0.0.1, port: 8000}

# Группировка алертов в инциденты по ключу (атакующая сторона, класс атаки): новый инцидент
# открывается, если между соседними алертами ключа прошло больше window_ms (15 минут)
grouping:
  window_ms: 900000
  # Фича 004 (research R8): как определять атакующую сторону потока.
  # auto  — по данным самого потока (TCP SYN по направлениям, затем «сервисный» порт < 1024):
  #         ответный поток «сервер → клиент» группируется по клиенту-атакующему;
  # as_is — как в фиче 002: атакующий = src_ip потока (для сравнения «до/после» и отката)
  direction: auto

severity:
  # Сколько алертов в инциденте поднимает серьёзность на одну ступень (не выше critical)
  bump_at: 100
  # Базовый уровень по классу атаки: low | medium | high | critical
  base:
    reconnaissance: low
    analysis: low
    fuzzers: medium
    generic: medium
    dos: medium
    exploits: high
    shellcode: high
    backdoor: high
    worms: high
    # Фича 004: сработал только детектор аномалий — класс атаки неизвестен (FR-017)
    anomaly: medium

# Адреса, которые нельзя блокировать и изолировать ни при каких условиях — для них
# предлагается только ручной разбор (FR-020)
protected_ips: []

playbook:
  # Правила проверяются сверху вниз, срабатывает первое подходящее — поэтому
  # предложение для одного и того же инцидента всегда одно и то же (FR-017).
  # Условия when: protected (bool), class_in (список классов), max_targets (не больше
  # N уникальных целей), min_severity (серьёзность не ниже). Пустой when — подходит всегда.
  rules:
    - {id: protected, when: {protected: true}, action: manual_review}
    # Фича 004: «аномалия» — класс атаки неизвестен, автоматически блокировать нельзя
    # (FR-017). Эта же гарантия продублирована в коде (anomaly_guard в soc/playbooks.py)
    - {id: unknown_class, when: {class_in: [anomaly]}, action: manual_review}
    - {id: intrusion_single_target, when: {class_in: [exploits, shellcode, backdoor, worms], max_targets: 1}, action: isolate_host}
    - {id: intrusion_many_targets, when: {class_in: [exploits, shellcode, backdoor, worms]}, action: block_source_ip}
    - {id: noisy_attack, when: {class_in: [dos, generic, fuzzers]}, action: block_source_ip}
    - {id: recon, when: {class_in: [reconnaissance, analysis], min_severity: medium}, action: block_source_ip}
    - {id: default, when: {}, action: observe}

# ---------------------------------------------------------------- фича 003: консоль

# Именованные сети для подсказок «подозрительный источник» (FR-018, research R8).
# role: victims | background | infrastructure | other. Метку источника дают только
# victims и background: если «атакующий» адрес на деле из сети жертв или фонового трафика,
# скорее всего, группировка поймала ответное направление. Метка — лишь подсказка аналитику:
# серьёзность, статус и действие инцидента она не меняет (FR-020).
# Значения по умолчанию — наблюдения из прогона 002 на UNSW-NB15.
networks:
  - {name: "жертвы UNSW-NB15", role: victims, cidrs: [149.171.126.0/24]}
  - {name: "фон UNSW-NB15", role: background, cidrs: [59.166.0.0/24]}

ui:
  # Как часто открытые панель, список и баннер нового прогона опрашивают сервер (3…300 с)
  refresh_seconds: 10
  # Строк на странице списка инцидентов и журнала аудита
  page_size: 50
  # Сколько последних алертов прогона показывать на панели
  recent_alerts: 20
  # Алертов на страницу в карточке инцидента
  alerts_page_size: 50
