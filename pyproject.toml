[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlsiem"
version = "0.1.0"
description = "ML-SIEM v2: SIEM/SOAR с ML-детекцией сетевых атак"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{ name = "Sinitsyn Vladislav" }]
dependencies = [
    # nfstream требует установленный Npcap (режим WinPcap API-compatible) на Windows
    "nfstream==6.6.*",
    "polars",
    "pyarrow",
    "scikit-learn",
    "matplotlib",
    "jinja2",
    "pyyaml",
    "psutil",
    "dvc>=3,<4",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "scapy",
]

[project.scripts]
mlsiem = "mlsiem.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mlsiem"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: тесты на реальных датасетах (нужны PCAP на диске A:)",
]
addopts = "-m 'not slow'"
