[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlsiem"
version = "0.1.0"
description = "ML-SIEM v2: SIEM/SOAR с ML-детекцией сетевых атак"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{ name = "Sinitsyn Vladislav" }]
dependencies = [
    # nfstream требует установленный Npcap (режим WinPcap API-compatible) на Windows
    "nfstream==6.6.*",
    "polars",
    "pyarrow",
    "scikit-learn",
    "matplotlib",
    "jinja2",
    "pyyaml",
    "psutil",
    "dvc>=3,<4",
    # фича 002: кандидат-детектор, журнал экспериментов, API аналитика, артефакт модели
    "lightgbm",
    "mlflow",
    "fastapi",
    "uvicorn",
    "joblib",
    # фича 003: разбор HTML-форм консоли (без него Form(...) в FastAPI не работает)
    "python-multipart",
    # фича 005: клиент Kafka (librdkafka, идемпотентный продюсер, ручное подтверждение позиций)
    # и быстрый JSON для сообщений о потоках (orjson уже приходил транзитивно — делаем явным)
    "confluent-kafka",
    "orjson",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "scapy",
    # TestClient FastAPI работает поверх httpx
    "httpx",
    # фича 003: разбор HTML страниц консоли в UI-тестах
    "beautifulsoup4",
]
# фича 005: сборка seed-ISO автоустановки брокерной машины (чистый Python, без genisoimage)
stand = ["pycdlib"]
# фича 007: нейросеть окон (GRU) — PyTorch с колёсами CUDA 12.8 (RTX 3060 Ti, драйвер 610.74).
# Отдельная группа: ~2.5 ГБ нужны только эксперименту `detect windows` и эксперту окон вида
# gru; цепочка, бустинг окон и быстрые тесты работают без неё (`uv sync --extra nn`)
nn = ["torch>=2.4,<3"]

[project.scripts]
mlsiem = "mlsiem.cli:main"

# Фича 007: torch берётся из индекса PyTorch (колёса с CUDA), а не с PyPI (там для Windows —
# только CPU). explicit = true — из этого индекса берётся ТОЛЬКО torch, остальное — с PyPI
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", extra = "nn" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/mlsiem"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Depends/Query/Header в значениях по умолчанию — штатный способ объявлять параметры FastAPI
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: тесты на реальных датасетах — данные 001 (data/) и PCAP на диске A:",
    "stand: тесты на настоящем брокере Kafka (машина mlsiem-broker)",
    # фича 006: живые проверки на поднятом стенде (сенсор, сценарии, изоляция) — только явным -m lab
    "lab: тесты на поднятом лабораторном стенде 006 (ВМ жертвы, атакующего, живой сенсор)",
    # фича 007: без PyTorch такие тесты пропускаются через pytest.importorskip("torch")
    "nn: тесты, которым нужен PyTorch (группа зависимостей nn)",
]
addopts = "-m 'not slow and not stand and not lab'"
