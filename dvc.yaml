# Конвейер данных фичи 001: flows → split → audit → compare_v1 → report.
# Весь конвейер: `uv run mlsiem data all` (это `dvc repro`); DVC перезапускает только те
# стадии, у которых поменялись зависимости.
#
# Сырые PCAP (~100 ГБ) в deps не указаны намеренно: DVC хешировал бы их при каждой проверке.
# Их изменения ловят отпечатки в манифестах захватов — стадия flows сама пересчитает
# только изменившиеся захваты (для этого outs помечены persist: DVC не удаляет готовое).
stages:
  flows_unsw:
    cmd: uv run mlsiem data flows --dataset unsw
    deps:
      - src/mlsiem/data/extract.py
      - src/mlsiem/data/labeling.py
      - src/mlsiem/data/pipeline.py
      - src/mlsiem/data/captures.py
      - src/mlsiem/data/schema.py
      - src/mlsiem/data/taxonomy.py
      - src/mlsiem/data/sources/unsw.py
    params:
      - configs/data.yaml:
          - datasets.unsw
    outs:
      - data/flows/unsw:
          persist: true

  flows_ctu13:
    cmd: uv run mlsiem data flows --dataset ctu13
    deps:
      - src/mlsiem/data/extract.py
      - src/mlsiem/data/labeling.py
      - src/mlsiem/data/pipeline.py
      - src/mlsiem/data/captures.py
      - src/mlsiem/data/schema.py
      - src/mlsiem/data/taxonomy.py
      - src/mlsiem/data/sources/ctu13.py
    params:
      - configs/data.yaml:
          - datasets.ctu13
    outs:
      - data/flows/ctu13:
          persist: true

  split:
    foreach:
      unsw_time: unsw
      unsw_cross_day: unsw
      ctu13_scenario: ctu13
    do:
      cmd: uv run mlsiem data split --name ${key}
      deps:
        - data/flows/${item}
        - src/mlsiem/data/split.py
      params:
        - configs/data.yaml:
            - split
      outs:
        - data/splits/${key}.json
        - data/splits/${key}.parquet

  audit:
    foreach:
      unsw_time: unsw
      unsw_cross_day: unsw
      ctu13_scenario: ctu13
    do:
      cmd: uv run mlsiem data audit --split ${key}
      deps:
        - data/flows/${item}
        - data/splits/${key}.parquet
        - src/mlsiem/data/audit.py
      params:
        - configs/data.yaml:
            - audit
            - seed
      outs:
        - data/audit/${key}.parquet

  compare_v1:
    cmd: uv run mlsiem data compare-v1
    deps:
      - data/flows/unsw/summary.csv
      - data/flows/ctu13/summary.csv
      - src/mlsiem/data/compare_v1.py
      - configs/v1_diff_notes.yaml
    params:
      - configs/data.yaml:
          - v1_processed_dir
    outs:
      - data/compare_v1.csv

  report:
    cmd: uv run mlsiem data report --output reports
    deps:
      - data/flows/unsw/summary.csv
      - data/flows/ctu13/summary.csv
      - data/splits
      - data/audit
      - data/compare_v1.csv
      - src/mlsiem/data/report
    outs:
      - reports/data_quality.html
      - reports/data_quality.md

  # Фича 002: эксперимент детектора (logreg vs lgbm на unsw_time, перенос на unsw_cross_day).
  # MLflow (mlflow.db и mlruns/) — вне DVC и git: это журнал запусков, а не выход конвейера;
  # всё нужное для воспроизведения лежит в models/detector/experiment.json и отчёте.
  train_detector:
    cmd: uv run mlsiem detect train
    deps:
      - data/flows/unsw
      - data/splits/unsw_time.parquet
      - data/splits/unsw_cross_day.parquet
      - src/mlsiem/detect
    params:
      - configs/detect.yaml:
          - split
          - transfer_split
          - seed
          - selection
          - candidates
          - output
    outs:
      - models/detector
      - reports/detector_experiment.md

  # Фича 004: эксперимент «эксперты + мета-слой» (детектор аномалий, мета-кандидаты,
  # скрытые классы, выбор по FR-010). Классификатор 002 — вход, он здесь не переобучается.
  # MLflow (эксперимент ensemble) — вне DVC, как у train_detector; отчёт — не в кеше DVC.
  train_ensemble:
    cmd: uv run mlsiem detect ensemble
    deps:
      - data/flows/unsw
      - data/splits/unsw_time.parquet
      - models/detector
      - configs/detect.yaml
      - src/mlsiem/detect
    params:
      - configs/ensemble.yaml:
          - split
          - seed
          - classifier
          - anomaly
          - meta
          - hidden_classes
          - selection
          - audit
          - unreliable_below
          - output
    outs:
      - models/experts/anomaly
      - models/ensemble
      - reports/ensemble_experiment.md:
          cache: false

  # Фича 007: детектор на окнах потоков (бустинг окон против нейросети окон против текущей
  # модели). Сразу за экспериментом — аудит на артефакты: он переписывает решение в карточке
  # models/windows/window_card.json, и если запускать его отдельно, выход стадии после
  # аудита всегда отличался бы от записанного в dvc.lock. Режим направления окна берётся из
  # configs/soc.yaml (grouping.direction) — поэтому он тоже в зависимостях.
  # Нейросети нужен PyTorch: `uv sync --extra nn` (иначе эксперимент откажется запускаться).
  # Запускать ТОЛЬКО `dvc repro --single-item train_windows`: models/detector и
  # models/ensemble здесь — входы, а не то, что надо пересобирать. Без флага DVC увидит, что
  # src/mlsiem/detect изменился с 002, удалит детектор и начнёт переобучать его (и ансамбль
  # 004) — версии моделей под прогонами в базе поменяются.
  train_windows:
    cmd: uv run mlsiem detect windows && uv run mlsiem detect windows-audit
    deps:
      - data/flows/unsw
      - data/splits/unsw_time.parquet
      - data/splits/unsw_cross_day.parquet
      - data/audit/unsw_time.parquet
      - models/detector
      - models/ensemble
      - configs/soc.yaml
      - src/mlsiem/detect/windows.py
      - src/mlsiem/detect/windows_experiment.py
      - src/mlsiem/detect/windows_expert.py
      - src/mlsiem/detect/windows_nn.py
      - src/mlsiem/detect/windows_audit.py
    params:
      - configs/windows.yaml:
          - split
          - transfer_split
          - seed
          - window
          - current_model
          - current_aggregate
          - selection
          - audit
          - candidates
          - output
    outs:
      - models/windows
      - reports/windows_experiment.md:
          cache: false
      - reports/windows_audit.md:
          cache: false

  # Фича 006: размеченный набор стенда. Отдельный output data/lab — это ПЕРВЫЙ собственный
  # набор проекта (benign/класс/ambiguous), собранный живым сенсором из записи сеанса и
  # журнала сценариев. Он НЕ смешивается с UNSW/CTU-13 и не используется для обучения в 006.
  #
  # Запускать ТОЛЬКО `dvc repro --single-item lab_dataset` (как train_windows, инцидент 007):
  # без флага DVC увидит, что src/mlsiem изменился, и каскадно перезапустит flows/train_* —
  # версии моделей под прогонами в базе поменялись бы. Вход (pcap сеанса и журнал) приходит
  # с машин стенда (Copy-VMFile) и в deps не указан: пересборка — по явной команде владельца.
  lab_dataset:
    cmd: uv run mlsiem lab dataset build --pcap var/lab/session.pcap --journal var/lab/journal.jsonl
    deps:
      - src/mlsiem/lab/dataset.py
      - src/mlsiem/lab/journal.py
      - src/mlsiem/stream/sensor.py
      - src/mlsiem/data/extract.py
      - src/mlsiem/data/schema.py
    outs:
      - data/lab:
          persist: true
